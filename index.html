<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Campaign Edit — who fronted which brand, and when</title>
<meta name="description" content="Search any clothing brand and see every model and campaign face it has used, by year and season. Every entry links to its source.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 fill=%22%23293829%22/%3E%3Ctext x=%2216%22 y=%2223%22 font-family=%22Georgia%22 font-size=%2220%22 fill=%22%23f6f4ef%22 text-anchor=%22middle%22%3EE%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="site-header">
  <a class="logo" href="#/">The Campaign <em>Edit.</em></a>
  <form class="search-form" id="searchForm" role="search">
    <input id="search" type="search" placeholder="Search a brand or model — e.g. bebe, Hailey Clauson" aria-label="Search a brand or model" autocomplete="off">
  </form>
  <nav>
    <a href="#/brands">Brands</a>
    <a href="#/models">Models</a>
    <a href="#/years">Years</a>
    <a href="#/about">About</a>
  </nav>
</header>
<main id="app" tabindex="-1"><p class="loading">Loading…</p></main>
<footer class="site-footer">
  <span>The Campaign Edit · Independent fashion archive</span>
  <span id="updated"></span>
</footer>
<dialog id="lightbox" aria-label="Campaign photo">
  <button class="lb-close" type="button" aria-label="Close">×</button>
  <button class="lb-nav lb-prev" type="button" aria-label="Previous photo">‹</button>
  <div class="lb-img"></div>
  <button class="lb-nav lb-next" type="button" aria-label="Next photo">›</button>
  <div class="lb-caption"></div>
</dialog>
<script src="app.js"></script>
</body>
</html>
